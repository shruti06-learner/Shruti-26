<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive 3D Foldable Birthday Card</title>

<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Poppins:wght@400;500;600&display=swap');

  /* Background -- warm luxurious ambiance */
  body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #fce4ec 0%, #f8bbd0 40%, #885544 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    perspective: 1600px;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    overflow: hidden;
  }

  /* Card container */
  #card {
    width: 340px;
    height: 460px;
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.25));
  }

  /* Inside panel (Base of the card) */
  #inside {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #fff0f3 0%, #fffbfc 100%);
    border-radius: 12px;
    border: 1px solid #f3c6cc;
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Inside content styling */
  #inside-left {
    flex: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 0.5rem;
  }

  #inside-left p {
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #6b424d;
    font-weight: 500;
  }

  #inside-right {
    flex: 1;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    justify-content: center;
  }

  #inside-right .image-frame {
    width: 48%;
    height: 150px;
    border-radius: 10px;
    background: #ffffff;
    box-shadow: 0 6px 15px rgba(182, 94, 112, 0.15);
    border: 2px solid #e09facc4;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
  }
  
  #inside-right .image-frame:hover {
    transform: translateY(-3px);
  }

  /* Changed to cover so pictures fully fill the frame */
  #inside-right .image-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
  }

  /* Front cover */
  #front {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
    z-index: 2;
    transform-origin: left;
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    backface-visibility: hidden;
    border: 2px solid rgba(255, 255, 255, 0.4);
    box-shadow: 10px 10px 30px rgba(0, 0, 0, 0.15);
  }

  /* Elegant inner border on cover */
  #front::before {
    content: '';
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px dashed rgba(255, 255, 255, 0.6);
    border-radius: 8px;
    pointer-events: none;
  }

  #card.open #front {
    transform: rotateY(-180deg);
  }

  #front h1 {
    font-family: 'Pacifico', cursive;
    font-size: 2.6rem;
    color: #ffffff;
    text-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    user-select: none;
    text-align: center;
    margin-top: 2rem;
  }

  #front .prompt {
    font-size: 0.95rem;
    color: #fff0f3;
    font-style: italic;
    text-align: center;
    user-select: none;
    letter-spacing: 0.08em;
    animation: pulse 1.5s infinite alternate;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
  }

  @keyframes pulse {
    from { opacity: 0.6; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1.03); }
  }

  /* Pop-up floating container */
  #balloons-container {
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    z-index: 10;
  }

  /* Balloon style */
  .balloon {
    position: absolute;
    bottom: 0;
    width: 26px;
    height: 34px;
    border-radius: 50% 50% 60% 60% / 60% 60% 50% 50%;
    filter: drop-shadow(0 0 4px rgba(255, 105, 135, 0.5));
    animation: floatUp linear forwards;
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    width: 1.5px;
    height: 16px;
    background: rgba(182, 94, 112, 0.5);
    transform: translateX(-50%);
  }

  /* Heart style */
  .heart {
    position: absolute;
    bottom: 0;
    width: 18px;
    height: 18px;
    background-color: #ff3366;
    transform: rotate(-45deg);
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 4px rgba(255, 51, 102, 0.6));
  }
  .heart::before, .heart::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    background-color: #ff3366;
    border-radius: 50%;
  }
  .heart::before { top: -9px; left: 0; }
  .heart::after { top: 0; left: 9px; }

  /* Sparkle style */
  .sparkle {
    position: absolute;
    bottom: 0;
    width: 12px;
    height: 12px;
    background: #ffd700;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 5px #ffea75);
  }

  /* Color variations */
  .color1 { background: radial-gradient(circle at 40% 30%, #ff9a9e, #fecfef); }
  .color2 { background: radial-gradient(circle at 40% 30%, #a1c4fd, #c2e9fb); }
  .color3 { background: radial-gradient(circle at 40% 30%, #fbc531, #e84118); }
  .color4 { background: radial-gradient(circle at 40% 30%, #ff758c, #ff7eb3); }
  .color5 { background: radial-gradient(circle at 40% 30%, #00cdac, #8ddad5); }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.8) rotate(var(--rot, 0deg)); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-280px) scale(1.2) rotate(var(--rot, 0deg)); opacity: 0; }
  }

  /* Audio toggle button */
  #audio-toggle {
    position: absolute;
    bottom: -55px;
    right: 0;
    background: #ff758c;
    border-radius: 9999px;
    width: 42px;
    height: 42px;
    border: 2px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 117, 140, 0.5);
    transition: all 0.3s ease;
    z-index: 20;
  }
  #audio-toggle:hover { background: #ff5277; transform: scale(1.08); }
  #audio-toggle svg { width: 20px; height: 20px; fill: #ffffff; }

  @media (max-width: 480px) {
    #card { width: 290px; height: 400px; }
    #inside-right .image-frame { height: 120px; }
    #front h1 { font-size: 2.2rem; }
    #inside-left p { font-size: 0.8rem; }
  }
</style>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>

<div id="card" aria-label="Foldable birthday greeting card" role="button" tabindex="0" aria-pressed="false">
  
  <!-- Front Cover -->
  <section id="front">
    <h1>Happy Birthday!</h1>
    <div class="prompt">✨ Tap to open ✨</div>
  </section>

  <!-- Inside Card Base -->
  <section id="inside">
    <div id="inside-left">
      <p id="birthday-message">
        Wishing you a day filled with love, laughter,<br>and countless joyful moments. 💖<br><br>
        Each and Every year bring you endless happiness and success.<br><br>
        With all my heart,<br><strong><b>your sister.</b></strong>
      </p>
    </div>
    <div id="inside-right">
      <div class="image-frame">
        <img src="C:\Users\Shruti\Downloads\WhatsApp Image 2026-10-30 at 7.42.21 PM.jpeg" alt="Your personal photo 1" />
      </div>
      <div class="image-frame">
        <img src="C:\Users\Shruti\Downloads\WhatsApp Image 2026-10-30 at 7.41.59 PM.jpeg" alt="Your personal photo 2" />
      </div>
    </div>
  </section>

  <div id="balloons-container" aria-hidden="true"></div>

  <!-- Audio control -->
  <button id="audio-toggle" aria-label="Toggle birthday song">
    <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none;">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  </button>
</div>

<audio id="bg-audio" loop preload="auto">
  <source src="C:\Users\Shruti\Downloads\ytmp3free.cc_all-i-dream-of-is-your-eyes-mathew-lfield-subscribe-viralvideo-love-music-song-lyrics-youtubemp3free.org.mp3" type="audio/mpeg" />
</audio>

<script>
  const card = document.getElementById('card');
  const balloonsContainer = document.getElementById('balloons-container');
  const audioToggle = document.getElementById('audio-toggle');
  const bgAudio = document.getElementById('bg-audio');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');

  let isOpen = false;
  let balloonsTimeout;
  const balloonColors = ['color1', 'color2', 'color3', 'color4', 'color5'];

  function createFloatingItem() {
    const item = document.createElement('div');
    const rand = Math.random();

    if (rand < 0.35) {
      item.classList.add('heart');
      item.style.setProperty('--rot', '-45deg');
    } else if (rand < 0.65) {
      item.classList.add('sparkle');
      item.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
    } else {
      item.classList.add('balloon');
      const colorClass = balloonColors[Math.floor(Math.random() * balloonColors.length)];
      item.classList.add(colorClass);
      item.style.setProperty('--rot', '0deg');
    }

    const startPercent = Math.random() * 90;
    item.style.left = `${startPercent}%`;

    const duration = 3 + Math.random() * 2;
    item.style.animationDuration = duration + 's';
    item.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';

    balloonsContainer.appendChild(item);

    setTimeout(() => { item.remove(); }, (duration + 0.5) * 1000);
  }

  function spawnItems(amount = 25, interval = 120) {
    let count = 0;
    let spawnInterval = setInterval(() => {
      if (count >= amount) {
        clearInterval(spawnInterval);
        return;
      }
      createFloatingItem();
      count++;
    }, interval);
  }

  function openCard() {
    isOpen = true;
    card.classList.add('open');
    card.setAttribute('aria-pressed', 'true');

    balloonsContainer.innerHTML = '';
    spawnItems(28, 100);

    if (balloonsTimeout) clearTimeout(balloonsTimeout);
    balloonsTimeout = setTimeout(() => { balloonsContainer.innerHTML = ''; }, 6500);

    bgAudio.play().catch(() => console.log("Audio autoplay restricted by browser"));
    audioToggle.setAttribute('aria-pressed', 'true');
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
  }

  function closeCard() {
    isOpen = false;
    card.classList.remove('open');
    card.setAttribute('aria-pressed', 'false');

    balloonsContainer.innerHTML = '';

    bgAudio.pause();
    audioToggle.setAttribute('aria-pressed', 'false');
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  }

  function toggleCard() {
    if (isOpen) closeCard();
    else openCard();
  }

  card.addEventListener('click', toggleCard);

  card.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      toggleCard();
    }
  });

  audioToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bgAudio.paused) {
      bgAudio.play();
      audioToggle.setAttribute('aria-pressed', 'true');
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    } else {
      bgAudio.pause();
      audioToggle.setAttribute('aria-pressed', 'false');
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }
  });
</script>
</body>
</html>
